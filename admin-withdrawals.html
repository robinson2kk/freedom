<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Withdrawal requests — FREEDOM</title><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:var(--bg);color:var(--text)}main{width:min(900px,100%);margin:auto}.top,.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0}.muted{color:var(--text-dim);font-size:13px}.card button,.card select{padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);margin:5px}.card button{cursor:pointer}.warn{color:#70B9C2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><div class="top"><a href="./">FREEDOM</a><h1>Applicant withdrawal requests</h1><p class="muted">Private administrator workspace. Confirm the requester's identity through the original application email before deleting any application or public profile.</p><p><a href="./admin-professionals.html">← Professional applications</a></p></div><section id="gate" class="top">Checking administrator access…</section><section id="workspace" hidden><div class="top"><div class="row"><button data-filter="pending">Pending</button><button data-filter="reviewing">Reviewing</button><button data-filter="completed">Completed</button><button data-filter="declined">Declined</button><button data-filter="all">All</button></div><p id="count" class="muted"></p></div><div id="items"></div></section></main><script>
(()=>{const $=id=>document.getElementById(id);let filter="pending";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const root=$("items");root.innerHTML='<div class="top">Loading…</div>';try{const r=await fetch("/api/admin/withdrawals?status="+filter,{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load.");const rows=d.requests||[];$("count").textContent=rows.length+" request(s) shown.";root.innerHTML=rows.length?rows.map(x=>'<article class="card"><h2>'+esc(x.full_name)+'</h2><p><b>Email:</b> '+esc(x.email)+'</p><p><b>Reason:</b> '+esc(x.reason||"Not provided")+'</p><p class="muted">Submitted: '+esc(x.submitted_at)+' · Status: '+esc(x.status)+' · ID: '+esc(x.id)+'</p><p class="muted">Admin notes: '+esc(x.admin_notes||"—")+'</p><div class="row"><select id="s-'+esc(x.id)+'"><option value="reviewing">Reviewing</option><option value="declined">Declined</option><option value="completed">Complete & delete application</option></select><input id="n-'+esc(x.id)+'" placeholder="Admin notes (optional)" maxlength="1000"><button data-save="'+esc(x.id)+'">Save</button><span id="m-'+esc(x.id)+'" class="muted"></span></div><p class="warn">For completion, personally confirm the applicant controls the original application email before proceeding. Completion permanently deletes all applications under this email and removes any associated public listing.</p></article>').join(""):'<div class="top">No requests in this view.</div>';}catch(e){root.innerHTML='<div class="top">'+esc(e.message)+'</div>';}}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;load()}));
$("items").addEventListener("click",async e=>{const b=e.target.closest("[data-save]");if(!b)return;const id=b.dataset.save,status=document.getElementById("s-"+id).value,msg=document.getElementById("m-"+id);let payload={status,adminNotes:document.getElementById("n-"+id).value};if(status==="completed"){if(!confirm("Have you independently confirmed the applicant's identity through their original application email? This permanently deletes all applications for this email."))return;payload.identityConfirmed=true;}b.disabled=true;msg.textContent="Saving…";try{const r=await fetch("/api/admin/withdrawals/"+encodeURIComponent(id),{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||"Update failed.");msg.textContent="Saved.";load();}catch(err){msg.textContent=err.message;}finally{b.disabled=false;}});
async function init(){try{const r=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!d.user){$("gate").textContent="Please sign in with the administrator account.";return;}const a=await fetch("/api/admin/withdrawals?status=pending",{credentials:"same-origin"});if(!a.ok){$("gate").textContent="This account is not authorised.";return;}$("gate").hidden=true;$("workspace").hidden=false;load();}catch{$("gate").textContent="Could not check administrator access.";}}init();})();
</script></body></html>
