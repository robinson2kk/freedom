<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marketplace service review — FREEDOM</title><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{background:var(--bg);color:var(--text);padding:24px 16px}.wrap{max-width:1000px;margin:auto}.brand{color:var(--brand);font-weight:900;letter-spacing:.16em;text-decoration:none}.panel,.item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0}.muted{color:var(--text-dim);font-size:13px;line-height:1.6}.item h2{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:9px 14px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--text);cursor:pointer}.actions button.primary{background:var(--brand);color:var(--on-brand)}textarea{width:100%;min-height:70px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}.status{color:var(--brand);font-size:12px}</style></head><body><main class="wrap"><a class="brand" href="./">FREEDOM</a><h1>Marketplace service review</h1><p class="muted">This workspace reviews service descriptions and scope. Approval here does not publish a service or enable payments. Provider KYC and a separate launch activation remain required.</p><section id="gate" class="panel">Checking administrator access…</section><div id="list"></div></main><script>(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){try{const r=await fetch("/api/admin/marketplace/services",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load.");$("gate").textContent="Admin access confirmed.";const a=d.services||[];$("list").innerHTML=a.length?a.map(s=>'<article class="item"><h2>'+esc(s.title)+'</h2><p class="muted">'+esc(s.full_name)+' · '+esc(s.marketplace_category)+' · ₹'+(s.price_paise/100).toFixed(0)+' · '+esc(s.duration_minutes)+' min · '+esc(s.delivery_mode)+'</p><p>'+esc(s.description||"No description")+'</p><p class="muted">Provider review: '+esc(s.application_status||"")+' · Listing consent: '+(s.public_listing_consent===1?"Yes":"No")+' · Gateway onboarding: '+esc(s.provider_onboarding_status||"not started")+' · Service review: '+esc(s.review_status)+'</p><textarea id="notes-'+esc(s.id)+'" placeholder="Record scope, quality and safety review notes (required)">'+esc(s.review_notes||"")+'</textarea><div class="actions"><button class="primary" data-id="'+esc(s.id)+'" data-status="approved">Approve draft</button><button data-id="'+esc(s.id)+'" data-status="rejected">Reject draft</button><span class="status" id="msg-'+esc(s.id)+'"></span></div></article>').join(""):"<section class=panel>No service drafts yet.</section>"}catch(e){$("gate").textContent=e.message}}$("list").addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;const id=b.dataset.id,msg=$("msg-"+id);b.disabled=true;msg.textContent="Saving…";try{const r=await fetch("/api/admin/marketplace/services",{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,status:b.dataset.status,notes:$("notes-"+id).value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not save.");msg.textContent=d.message;await load()}catch(err){msg.textContent=err.message}finally{b.disabled=false}});load()})();</script></body></html>
