<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website feedback — FREEDOM admin</title><link rel="stylesheet" href="./theme.css"><style>body{padding:24px}.wrap{max-width:1000px;margin:auto}.item{border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0;background:var(--surface)}.muted{color:var(--text-dim);font-size:12px}.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);margin:4px;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="wrap"><p><a href="./admin-professionals.html">← Admin dashboard</a></p><h1>Website feedback</h1><p class="muted">Private feedback submissions. Treat recovery-related content as sensitive; do not copy it into public channels.</p><div class="toolbar"><select id="filter"><option value="open">Open</option><option value="reviewed">Reviewed</option><option value="archived">Archived</option><option value="all">All</option></select><button class="btn" id="refresh">Refresh</button></div><p id="status" class="muted" role="status"></p><section id="list"></section></main><script>
(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){ $("status").textContent="Loading…";try{const r=await fetch("/api/admin/feedback?status="+$("filter").value,{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not load feedback");$("list").innerHTML=d.feedback.length?d.feedback.map(f=>'<article class="item"><b>'+esc(f.rating)+'/5 · '+esc(f.feedback_type)+'</b><p>'+esc(f.message)+'</p><p class="muted">'+esc(f.created_at)+' · '+esc(f.contact_email||"Anonymous")+' · '+esc(f.page_path||"")+'</p><button class="btn" data-id="'+esc(f.id)+'" data-status="reviewed">Mark reviewed</button><button class="btn" data-id="'+esc(f.id)+'" data-status="archived">Archive</button></article>').join(""):'<p>No submissions in this view.</p>';$("status").textContent=d.feedback.length+" submissions"}catch(e){$("status").textContent=e.message}}$("refresh").onclick=load;$("filter").onchange=load;$("list").onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b)return;b.disabled=true;try{const r=await fetch("/api/admin/feedback",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.id,status:b.dataset.status})}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not update");await load()}catch(err){$("status").textContent=err.message;b.disabled=false}};load()})();
</script></body></html>
