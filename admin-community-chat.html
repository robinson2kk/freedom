<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Community moderation — FREEDOM</title><link rel="stylesheet" href="./theme.css"><style>
body{background:#061619;color:#f3f7f4}.wrap{max-width:900px;margin:35px auto;padding:0 18px}h1{font-size:30px}.muted{color:#9fb4ac;font-size:12px}.item{border:1px solid #24515a;border-radius:14px;padding:16px;margin:12px 0;background:#0b2428}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #24515a;border-radius:8px;padding:9px 12px;background:#10343a;color:#f3f7f4;cursor:pointer}.actions .danger{background:#512b2b}.actions .ok{background:#22dcc6;color:#06211f}a{color:#22dcc6}
</style></head><body><main class="wrap"><p><a href="./admin-professionals.html">← Admin dashboard</a></p><h1>Community chat moderation</h1><p class="muted">Review member reports. Hiding or removing a message affects its visibility in the public chat.</p><div id="list" class="muted">Loading reports…</div></main><script>
const list=document.getElementById("list");
async function request(url,opts={}){const r=await fetch(url,{credentials:"same-origin",headers:{"content-type":"application/json"},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed.");return d}
async function load(){try{const d=await request("./api/admin/community-chat");list.innerHTML=d.reports.length?d.reports.map(x=>'<article class="item"><div class="muted">Report reason: '+esc(x.reason)+' · '+esc(x.reported_at)+'</div><strong>'+esc(x.display_name)+'</strong><p>'+esc(x.message)+'</p><div class="actions"><button class="ok" data-id="'+esc(x.message_id)+'" data-action="hide">Hide</button><button class="danger" data-id="'+esc(x.message_id)+'" data-action="remove">Remove</button></div></article>').join(""):"No open reports."}catch(e){list.textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
list.addEventListener("click",async e=>{const b=e.target.closest("[data-id]");if(!b)return;try{await request("./api/admin/community-chat",{method:"PATCH",body:JSON.stringify({message_id:b.dataset.id,action:b.dataset.action})});await load()}catch(err){alert(err.message)}});
load();
</script></body></html>
